<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainBuddy – Learn Smarter. Think Better. Achieve More.</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#150d28;--bg2:#1c1236;--card:#261a47;--line:#3a2a66;--lav:#c8b6ff;--pri:#8b5cf6;--txt:#efeaff;--mut:#a99bd0;--ok:#5eead4;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:radial-gradient(circle at 85% -10%,#3b2578,transparent 45%),var(--bg);color:var(--txt);min-height:100vh;display:flex}
aside{width:236px;background:var(--bg2);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow:auto;padding:16px 10px;flex-shrink:0;transition:.25s}
aside h3{color:var(--lav);padding:4px 12px 12px;font-size:20px}
aside button{display:flex;gap:10px;width:100%;padding:10px 12px;margin:2px 0;border:0;border-radius:10px;background:none;color:var(--mut);font:600 14px Nunito;cursor:pointer;text-align:left;transition:.2s}
aside button:hover{background:#2c1f50;color:var(--txt)}aside button.on{background:linear-gradient(90deg,#6d3fe0,#8b5cf6);color:#fff}
main{flex:1;padding:24px;min-width:0;max-width:1100px;margin:auto}
#menu{display:none;position:fixed;top:10px;left:10px;z-index:9;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:18px}
h1{font-size:28px}h2{font-size:18px;margin:18px 0 10px;color:var(--lav)}p{color:var(--mut);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2:first-child{margin-top:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(var(--m,220px),1fr))}.grid>.card{margin:0}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#3a2373,#261a47);border-radius:18px;padding:18px;margin-bottom:16px}
.logo{height:110px;border-radius:14px;background:#fff8ef;padding:4px}
.stat{text-align:center}.stat b{display:block;font-size:30px;color:var(--lav)}.stat span{color:var(--mut);font-size:13px}
.tile{border-radius:16px;padding:16px;border:1px solid var(--line);background:var(--c,#2a1d4e);color:var(--txt);text-align:left;font:inherit;cursor:pointer;transition:.2s}
.tile:hover{transform:translateY(-3px);border-color:var(--lav)}.tile b{display:block;font-size:17px}.tile span{color:var(--mut);font-size:13px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:700 14px Nunito;cursor:pointer;transition:.2s}.btn:hover{background:#7c3aed}
.btn.ghost{background:#33255d}.btn.sm{padding:6px 10px;font-size:12px}
input,select,textarea{background:#1a1030;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit;width:100%;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{background:#3a2a66;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}.pill.warn{background:#4a3410;color:var(--warn)}.pill.bad{background:#4d1d2c;color:var(--bad)}.pill.ok{background:#12403d;color:var(--ok)}
.bar{background:#1a1030;border-radius:99px;height:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#c8b6ff);border-radius:99px;transition:width .6s}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs .btn:not(.on){background:#33255d}
.opt{display:block;width:100%;text-align:left;background:#1a1030;border:1px solid var(--line);color:var(--txt);padding:12px;border-radius:10px;margin:8px 0;font:inherit;cursor:pointer}.opt:hover,.opt.sel{border-color:var(--lav);background:#2f2058}
.good{color:var(--ok)}.badc{color:var(--bad)}
.chart{display:flex;gap:10px;align-items:flex-end;height:180px;padding-top:10px}.chart div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.chart i{display:block;background:linear-gradient(0deg,#6d3fe0,#c8b6ff);border-radius:8px 8px 0 0;margin-bottom:4px;transition:height .6s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.day{position:relative;background:#1a1030;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 0;cursor:pointer}.day.sel{background:var(--pri)}.day.tod{border-color:var(--lav)}.day b{position:absolute;bottom:4px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:var(--warn)}
.flip{perspective:900px;height:200px;cursor:pointer;margin:12px 0}.flip div{position:relative;width:100%;height:100%;transition:.6s;transform-style:preserve-3d}.flip.f div{transform:rotateY(180deg)}.flip p{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-size:20px;font-weight:700;color:var(--txt);background:linear-gradient(135deg,#4b2d9a,#2c1f50);border-radius:16px;backface-visibility:hidden}.flip p+p{transform:rotateY(180deg);background:linear-gradient(135deg,#2c1f50,#6d3fe0)}
.timer{font-size:72px;font-weight:800;text-align:center;color:var(--lav);margin:10px 0}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}#msgs{flex:1;overflow:auto;padding:6px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;margin:8px 0;line-height:1.5;font-size:14px}.m.u{background:var(--pri);margin-left:auto}.m.b{background:#33255d}.m img{max-width:220px;border-radius:10px}.m ul{padding-left:18px}
.send{display:flex;gap:6px}.send input{margin:0}.send .btn{padding:8px 12px}
.me{background:#3a2373;border-radius:10px}
table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.lock{opacity:.45}.bare aside{display:none}.bare #menu{display:none}
#toast{position:fixed;bottom:20px;right:20px;background:var(--lav);color:#1c1236;padding:12px 18px;border-radius:12px;font-weight:700;transform:translateY(100px);transition:.3s;z-index:20}#toast.on{transform:none}
pre{background:#1a1030;padding:12px;border-radius:10px;overflow:auto;font-size:13px;color:var(--lav)}
@media(max-width:860px){aside{position:fixed;z-index:8;left:-250px}aside.open{left:0}#menu{display:block}main{padding:60px 14px 20px}.timer{font-size:52px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

function startTest(sub,exam){const qs=(sub==='all'?Object.keys(Q):[sub]).flatMap(k=>Q[k].map(x=>[...x,k]));
 Z={qs,i:0,a:[],exam,left:exam?qs.length*45:0};if(exam){document.body.classList.add('bare');Z.t=setInterval(()=>{Z.left--;if(Z.left<=0)finish();else if($('tm'))$('tm').textContent=fmt(Z.left)},1000)}drawQ()}
function drawQ(){const q=Z.qs[Z.i];$('view').innerHTML=`<div class="card"><div class="row"><b>${Z.exam?'Exam':'Quiz'} · Question ${Z.i+1} of ${Z.qs.length}</b>${Z.exam?`<span class="pill warn" id="tm">${fmt(Z.left)}</span>`:''}</div><div class="bar" style="margin:10px 0"><i style="width:${Z.i/Z.qs.length*100}%"></i></div><h2>${q[0]}</h2>${q[1].map((o,j)=>`<button class="opt ${Z.a[Z.i]===j?'sel':''}" onclick="Z.a[Z.i]=${j};drawQ()">${o}</button>`).join('')}<div class="row"><button class="btn ghost" onclick="if(Z.i>0){Z.i--;drawQ()}">Back</button><button class="btn" onclick="Z.i<Z.qs.length-1?(Z.i++,drawQ()):finish()">${Z.i==Z.qs.length-1?'Finish':'Next'}</button></div></div>`}
function finish(){clearInterval(Z.t);document.body.classList.remove('bare');const ok=Z.qs.map((q,i)=>Z.a[i]===q[2]),c=ok.filter(Boolean).length,pct=Math.round(c/Z.qs.length*100);
 [...new Set(Z.qs.map(q=>q[3]))].forEach(k=>{const l=Z.qs.map((q,i)=>[q,ok[i]]).filter(x=>x[0][3]===k);S.scores[k].push(Math.round(l.filter(x=>x[1]).length/l.length*100))});
 S.quizzes++;S.xp+=c*10;let msg='';if(pct>80){S.game=Math.min(5,S.game+1);S.xp+=50;msg='🎉 Above 80%! A new game level is unlocked (+50 XP).'}else msg='Score above 80% to unlock the next game level.';S.todayMin+=Z.exam?10:5;save();
 $('view').innerHTML=`<div class="card"><h1>${Z.exam?'Exam report':'Your result'}</h1><div class="grid" style="--m:140px;margin:14px 0">${stat(pct+'%','Score')}${stat(c+'/'+Z.qs.length,'Correct')}${stat(pct+'%','Accuracy')}${stat('+'+c*10,'XP earned')}</div><p>${msg}</p><h2>Answer analysis</h2>${Z.qs.map((q,i)=>`<p style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="${ok[i]?'good':'badc'}">${ok[i]?'✔ Correct':'✘ Incorrect'}</span> · ${q[0]}<br>Your answer: ${Z.a[i]!=null?q[1][Z.a[i]]:'Skipped'}${ok[i]?'':` · Correct: <b>${q[1][q[2]]}</b>`}</p>`).join('')}<br><button class="btn" onclick="go('${Z.exam?'exam':'quiz'}')">Try another</button> <button class="btn ghost" onclick="go('prog')">View progress</button></div>`}

let CH=[{r:'b',h:'Hi! I’m BrainBuddy AI. Ask me about Python, C++, maths or physics, or open the Scanner to check a suspicious message.'}];
const KB=[[/python|loop|list|dict/,'Python uses indentation for blocks. Start with variables, loops, functions, and lists. Try small programs daily.','Python is beginner-friendly: practise loops and lists first, then functions. You’ve got this!'],
[/c\+\+|pointer|class/,'In C++, a pointer stores a memory address. Use * to read the value and & to get an address. Classes bundle data and functions.','Pointers are just labelled addresses! Draw boxes and arrows, it clicks fast. 😊'],
[/math|derivative|integral|matrix/,'Differentiation measures rate of change; integration accumulates area. Key rule: d/dx xⁿ = n·xⁿ⁻¹.','Maths gets easier with practice. Try the derivative of x² first. Answer: 2x! ✨'],
[/physics|force|energy|velocity/,'Newton’s second law states F = ma. Work done is force times displacement; kinetic energy is ½mv².','Physics is about patterns: F = ma explains most of motion. Start with units! 🚀'],
[/tired|stress|sad|motivat|exam|help/,'Plan short sessions, review weak topics first, and rest well before exams.','Hey, you’re doing great! Take a 5-minute break, breathe, then try one small task. I’m cheering for you! 💜']];
const brain=t=>{const k=KB.find(x=>x[0].test(t.toLowerCase()));const p=S.mode==='pro';return k?(p?k[1]:k[2]):(p?'Please specify the subject or topic so I can provide a structured explanation.':'Tell me what you’re studying and I’ll help! Python, C++, maths or physics? 😊')};
V.chat=()=>`<div class="row"><h1>BrainBuddy AI</h1><div class="tabs" style="margin:0"><button class="btn ${S.mode==='pro'?'on':'ghost'}" onclick="S.mode='pro';save();go('chat')">🎓 Professional</button><button class="btn ${S.mode==='fr'?'on':'ghost'}" onclick="S.mode='fr';save();go('chat')">😊 Friendly</button></div></div>
 <div class="card chat" style="margin-top:12px"><div id="msgs">${CH.map(m=>`<div class="m ${m.r}">${m.h}</div>`).join('')}</div>
 <div class="send"><button class="btn ghost" onclick="$('cam').click()" title="Camera">📷</button><button class="btn ghost" onclick="$('img').click()" title="Upload image">🖼️</button><input id="ci" placeholder="Ask BrainBuddy AI…" onkeydown="if(event.key==='Enter')say()"><button class="btn ghost" onclick="voice()" title="Voice">🎤</button><button class="btn" onclick="say()">Send</button></div>
 <input type="file" id="cam" accept="image/*" capture="environment" hidden onchange="pic(this)"><input type="file" id="img" accept="image/*" hidden onchange="pic(this)"></div>`;

function push(r,h){CH.push({r,h});if(cur==='chat'){$('msgs').insertAdjacentHTML('beforeend',`<div class="m ${r}">${h}</div>`);$('msgs').scrollTop=1e9}}
function say(){const t=$('ci').value.trim();if(!t)return;$('ci').value='';push('u',esc(t));setTimeout(()=>push('b',brain(t)),500)}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input is not supported in this browser');const r=new R();r.onresult=e=>{$('ci').value=e.results[0][0].transcript;say()};r.start();toast('Listening…')}
function pic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{push('u',`<img src="${r.result}" alt="uploaded">`);push('b','Image received. Reading text inside images needs the AI backend (coming soon). Paste the text in the Scanner for a scam check, or describe the image to me. <br><button class="btn sm" onclick="go(\'scan\')">Open Scanner</button>')};r.readAsDataURL(f)}
V.scan=()=>`<h1>Fake Message & Account Scanner</h1><p>Results appear inside the BrainBuddy AI chat.</p><div class="card" style="margin-top:14px"><label>Upload a screenshot (message or social media account)</label><input type="file" id="sf" accept="image/*"><label>Paste the message, link or account details (username, followers, bio…)</label><textarea id="st" rows="6" placeholder="e.g. URGENT! Your KYC is blocked. Click bit.ly/xyz and enter your OTP"></textarea><button class="btn" onclick="runScan()">Scan now</button><p style="margin-top:12px">⚠️ Screenshot analysis gives an indication, not guaranteed proof that a message or account is genuine or fake.</p></div>`;
const RULES=[[/otp|password|\bpin\b|cvv/i,'Asks for OTP, password or PIN',3,'No request for OTP or passwords'],[/urgent|immediately|act now|last chance|within \d+ ?(hours|hrs|minutes)/i,'Urgent or pressuring language',2,'No pressure or urgency'],[/won|lottery|prize|free gift|congratulations|reward/i,'Unexpected prize or reward',3,'No surprise prizes'],[/bit\.ly|tinyurl|t\.co|goo\.gl|\.xyz|\.top|\.click|http:\/\//i,'Shortened, unusual or non-secure link',3,'No shortened or unusual links'],[/kyc|account (is )?(suspended|blocked)|verify your/i,'Account-suspension or verification threat',2,'No account-threat wording'],[/crypto|bitcoin|guaranteed return|double your|investment/i,'Investment or crypto promise',3,'No investment promises'],[/gift card|western union|send money|advance fee/i,'Requests money or gift cards',3,'No money requests'],[/joined (today|recently)|0 posts|dm me|whatsapp me|telegram/i,'New or empty account, or pushes you to private chat',2,'No new-account red flags']];
function runScan(){const t=$('st').value,f=$('sf').files[0],hit=RULES.filter(r=>r[0].test(t)),safe=RULES.filter(r=>!r[0].test(t)),s=hit.reduce((a,r)=>a+r[2],0);
 const go2=h=>{push('b',h);go('chat')};const li=a=>a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p>None found.</p>';
 const note='<p><small>⚠️ This is an indication, not guaranteed proof that a message or account is genuine or fake.</small></p>';
 const send=img=>{if(!t.trim()){return go2((img?`<img src="${img}" alt="screenshot"><br>`:'')+'<b>Risk: unknown.</b> I can’t read text from screenshots yet (needs the AI backend). Paste the message or account details in the Scanner for a check.'+note)}
  const lvl=s>=6?['bad','🚨 High-risk warning']:s>=3?['warn','⚠️ Suspicious']:['ok','✅ Looks lower-risk'];
  go2((img?`<img src="${img}" alt="screenshot"><br>`:'')+`<span class="pill ${lvl[0]}">${lvl[1]} · score ${s}</span><p><b>Safe-looking indicators</b></p>${li(safe.map(r=>r[3]))}<p><b>Suspicious indicators</b></p>${li(hit.map(r=>r[1]))}<p><b>Safety recommendations</b></p><ul><li>Never share OTPs, PINs or passwords.</li><li>Don’t click unknown links; open the official app or site yourself.</li><li>Verify with the organisation using its official contact.</li><li>Report and block suspicious accounts.</li></ul>`+note)};
 if(f){const r=new FileReader();r.onload=()=>send(r.result);r.readAsDataURL(f)}else send()}
 
V.lb=()=>{const k=V.lk||'g',mul={g:1,w:.35,m:.7}[k],rows=[...LB.map(x=>[x[0],Math.round(x[1]*mul),0]),[S.name+' (You)',Math.round(S.xp*mul),1]].sort((a,b)=>b[1]-a[1]);
 const link=location.origin+location.pathname+'?ref='+encodeURIComponent(S.name);
 return `<h1>Leaderboard</h1><div class="tabs" style="margin-top:12px">${[['g','Global'],['w','Weekly'],['m','Monthly']].map(x=>`<button class="btn ${k===x[0]?'on':'ghost'}" onclick="V.lk='${x[0]}';go('lb')">${x[1]}</button>`).join('')}</div>
 <div class="card"><table><tr><th>Rank</th><th>Student</th><th>XP</th></tr>${rows.map((r,i)=>`<tr class="${r[2]?'me':''}"><td>${['🥇','🥈','🥉'][i]||'#'+(i+1)}</td><td>${esc(r[0])}</td><td>${r[1]} XP</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Invite friends</h2><p>Study together and climb the board. Share your link:</p><div class="send" style="margin:10px 0"><input readonly value="${link}" id="lk"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText($('lk').value);toast('Link copied')">Copy</button></div>
 <form class="send" onsubmit="event.preventDefault();const v=this.f.value.trim();if(v){S.friends.push(v);save();go('lb');toast('Invite sent')}"><input name="f" placeholder="Friend’s name"><button class="btn">Invite</button></form><p style="margin-top:10px">Invited: ${S.friends.map(f=>`<span class="pill">${esc(f)}</span>`).join(' ')||'no one yet'}</p></div>`};
 
V.rew=()=>{const lv=Math.floor(S.xp/300)+1,p=Math.round(S.xp%300/3);
 const B=[['🥇','First quiz',S.quizzes>=1],['🔥','5-day streak',S.streak>=5],['🎯','Focus master (5 sessions)',S.focus>=5],['🧠','Scored 80%+',S.game>1],['⭐','500 XP',S.xp>=500],['📚','All subjects tried',Object.values(S.scores).every(a=>a.length)]];
 return `<h1>Rewards</h1><div class="grid" style="--m:150px;margin-top:14px">${stat(S.xp,'XP points')}${stat('Level '+lv,'Current level')}${stat(S.streak+' 🔥','Daily streak')}</div>
 <div class="card" style="margin-top:14px"><div class="row"><span>Progress to level ${lv+1}</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div></div>
 <h2>Achievement badges</h2><div class="grid" style="--m:170px">${B.map(b=>`<div class="card stat ${b[2]?'':'lock'}"><b>${b[0]}</b><span>${b[1]}</span></div>`).join('')}</div>
 <h2>Game levels</h2><p>Score above 80% in any quiz or exam to unlock the next level.</p><div class="grid" style="--m:150px;margin-top:10px">${[1,2,3,4,5].map(n=>`<div class="card stat ${n>S.game?'lock':''}"><b>${n>S.game?'🔒':'🎮'}</b><span>Level ${n}</span><br>${n>S.game?'':`<button class="btn sm" style="margin-top:8px" onclick="play(${n})">Play</button>`}</div>`).join('')}</div>`};
function play(n){const a=1+Math.floor(Math.random()*9*n),b=2+Math.floor(Math.random()*9),r=prompt(`Level ${n}: what is ${a} × ${b}?`);if(r===null)return;if(+r===a*b){S.xp+=20;save();go('rew');toast('Correct! +20 XP')}else toast(`Not quite. It was ${a*b}`)}
 
V.set=()=>`<h1>Settings</h1><div class="card" style="margin-top:14px;max-width:460px"><label>Your name</label><input id="sn" value="${esc(S.name)}"><label>Daily study goal (minutes)</label><input id="sg" type="number" min="15" value="${S.goal}"><button class="btn" onclick="S.name=$('sn').value||'Student';S.goal=+$('sg').value||120;save();toast('Settings saved')">Save settings</button> <button class="btn ghost" onclick="if(confirm('Reset all BrainBuddy data?')){localStorage.removeItem(KEY);location.reload()}">Reset data</button><p style="margin-top:14px">Data is stored in this browser only. The chatbot and scanner are rule-based demos, ready for a real AI backend later.</p></div>`;
go('dash');
</script></body></html>
